name: field_flow
description: "FIELDFlow - Offline-First Field Service Management Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Routing
  go_router: ^14.1.4

  # Networking & HTTP
  dio: ^5.4.3+1
  http: ^1.2.1

  # Local SQLite Persistence (Drift)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0

  # Dependency Injection
  get_it: ^7.7.0

  # Offline & Network Detection
  connectivity_plus: ^6.0.3

  # Geolocation & GPS
  geolocator: ^11.0.0

  # Camera & Image Capture
  image_picker: ^1.1.1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Notifications
  flutter_local_notifications: ^17.1.2

  # Permission Handling
  permission_handler: ^11.3.1

  # Open-Source Mapping (Zero paid API keys needed)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Image Caching & UI
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.8

  # Utilities
  intl: ^0.19.0
  logger: ^2.3.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation for Drift
  drift_dev: ^2.16.0
  build_runner: ^2.4.9

  # Testing Mocks
  mocktail: ^1.0.3
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
